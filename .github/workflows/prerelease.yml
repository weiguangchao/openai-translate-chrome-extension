name: Prerelease

on:
  schedule:
    - cron: '0 16 * * *'

permissions:
  contents: read

concurrency:
  group: prerelease
  cancel-in-progress: false

jobs:
  changes:
    name: Check main changes
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      sha: ${{ steps.changes.outputs.sha }}
      day: ${{ steps.changes.outputs.day }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Check the previous Beijing calendar day
        id: changes
        run: |
          day=$(TZ=Asia/Shanghai date --date=yesterday +%F)
          commit=$(git log -1 --format=%H \
            --since-as-filter="$day 00:00:00 +0800" \
            --until="$day 23:59:59 +0800")
          if [ -n "$commit" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "day=$day" >> "$GITHUB_OUTPUT"

  prerelease:
    name: Publish prerelease
    needs: changes
    if: needs.changes.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      ARCHIVE: subline-prerelease.zip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.changes.outputs.sha }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Package
        run: cd dist && zip -qr "../$ARCHIVE" .
      - name: Update prerelease tag
        run: |
          git tag --force prerelease HEAD
          git push --force origin refs/tags/prerelease
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: prerelease
          name: Prerelease
          body: |
            Daily main build for ${{ needs.changes.outputs.day }} (Asia/Shanghai).
            Commit ${{ needs.changes.outputs.sha }}.
          prerelease: true
          make_latest: false
          files: ${{ env.ARCHIVE }}
          fail_on_unmatched_files: true
