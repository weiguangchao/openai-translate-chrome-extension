name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VERSION: ${{ github.ref_name }}
      ARCHIVE: subline-${{ github.ref_name }}.zip
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check version
        run: |
          for file in package.json public/manifest.json; do
            found="v$(jq -r .version "$file")"
            if [ "$found" != "$VERSION" ]; then
              echo "::error file=$file::version is $found, tag is $VERSION"
              exit 1
            fi
          done
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Allow the installed Chromium to create sandbox namespaces
        run: |
          subline_chromium="$(node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          sudo tee /etc/apparmor.d/subline-chromium > /dev/null <<EOF
          abi <abi/4.0>,
          profile subline-chromium "$subline_chromium" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/subline-chromium
      - run: npm run verify
      - name: Package
        run: cd dist && zip -qr "../$ARCHIVE" .
      - uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ARCHIVE }}
          fail_on_unmatched_files: true
          generate_release_notes: true
      - name: Publish to Chrome Web Store
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
        run: node scripts/publish-chrome.mjs "$ARCHIVE"
