name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Allow the installed Chromium to create sandbox namespaces
        run: |
          subline_chromium="$(node --input-type=module -e 'import { chromium } from "playwright"; console.log(chromium.executablePath())')"
          sudo tee /etc/apparmor.d/subline-chromium > /dev/null <<EOF
          abi <abi/4.0>,
          profile subline-chromium "$subline_chromium" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/subline-chromium
      - run: npm run verify
      - name: Upload browser results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-results-${{ github.sha }}
          path: .artifacts/e2e/
          if-no-files-found: ignore
          retention-days: 7
