<!doctype html>
<meta charset="utf-8" />
<title>debug-chromium fixture</title>
<div id="movie_player" style="position: relative; width: 640px; height: 360px">
  <video src="/clip.webm" preload="auto" playsinline style="width: 100%; height: 100%"></video>
</div>
<script>
  // Query parameters make the page behave like the sites debug-chromium has to cope with:
  //   page=ID          label for the events this page beacons to /log
  //   player=youtube   #movie_player.setPlaybackRate, and the element's rate is put back
  //                    to the player's rate every second, as YouTube does
  //   ratefight=1      put the element's rate back to 1 every second with no player API,
  //                    as a speed extension in the user's Chrome did
  //   pullback=once|always
  //                    after a seek past 10 s, jump to 2 s, as YouTube does when it
  //                    restores a resume position
  //   stuck=1          play() does nothing, so the video never advances
  //   unmute=1         unmute the video once it plays
  //   track=1          add an English subtitle track that starts disabled, as X does
  //   refuse=STATUS    the player response refuses playback and the video never loads,
  //                    as YouTube does when it asks the viewer to sign in
  //   ad=SECONDS       the first SECONDS of playback are an ad in the same video element;
  //                    then the video restarts at 0, as YouTube does after a pre-roll
  const params = new URLSearchParams(location.search);
  const video = document.querySelector('video');
  const player = document.querySelector('#movie_player');
  const log = (type) =>
    navigator.sendBeacon(
      '/log',
      JSON.stringify({
        page: params.get('page'),
        type,
        time: Math.round(video.currentTime * 100) / 100,
        rate: video.playbackRate,
        muted: video.muted,
      }),
    );
  for (const type of ['seeking', 'ratechange', 'volumechange', 'playing', 'pause'])
    video.addEventListener(type, () => log(type));

  if (params.get('player') === 'youtube') {
    let rate = 1;
    player.setPlaybackRate = (value) => {
      rate = value;
      video.playbackRate = value;
    };
    player.playVideo = () => {
      log('player-play');
      return video.play();
    };
    player.seekTo = (value) => {
      log('player-seek');
      video.currentTime = value;
    };
    setInterval(() => {
      if (video.playbackRate !== rate) video.playbackRate = rate;
    }, 1000);
    const tracks = (params.get('languages') || 'zh-CN,en').split(',').map(languageCode => ({languageCode}));
    let selected = tracks[0];
    const cc = document.createElement('button');
    cc.className = 'ytp-subtitles-button';
    cc.style.position = 'absolute';
    cc.setAttribute('aria-pressed', params.has('ccoff') ? 'false' : 'true');
    cc.onclick = (event) => {
      if (params.has('trustedcc') && !event.isTrusted) return;
      cc.setAttribute('aria-pressed', String(cc.getAttribute('aria-pressed') !== 'true'));
    };
    player.append(cc);
    player.getOption = (_module, option) => option === 'tracklist' ? tracks : selected;
    player.setOption = (_module, _option, track) => {
      if (selected !== track) log('caption-selection');
      selected = track;
      player.dataset.language = track.languageCode;
    };
    player.dataset.language = selected.languageCode;
  }

  if (params.has('ratefight'))
    setInterval(() => {
      video.playbackRate = 1;
    }, 1000);

  const pullback = params.get('pullback');
  let pulled = 0;
  video.addEventListener('seeked', () => {
    if (!pullback || video.currentTime < 10 || (pullback === 'once' && pulled)) return;
    pulled += 1;
    setTimeout(() => {
      video.currentTime = 2;
    }, 100);
  });

  if (params.has('stuck')) HTMLMediaElement.prototype.play = () => Promise.resolve();

  if (params.has('track')) video.addTextTrack('subtitles', 'English', 'en').mode = 'disabled';

  const refuse = params.get('refuse');
  if (refuse) {
    player.getPlayerResponse = () => ({ playabilityStatus: { status: refuse, reason: 'Sign in' } });
    video.removeAttribute('src');
    video.load();
  }

  if (params.has('mediaerror')) video.src = '/missing-video.webm';
  if (params.has('shell')) player.remove();
  if (params.has('buffering')) {
    video.removeAttribute('src');
    video.load();
    setTimeout(() => { video.src = '/clip.webm'; }, 1500);
  }

  const ad = Number(params.get('ad'));
  if (ad) {
    player.classList.add('ad-showing');
    const end = () => {
      if (video.currentTime < ad) return;
      video.removeEventListener('timeupdate', end);
      player.classList.remove('ad-showing');
      video.currentTime = 0;
    };
    video.addEventListener('timeupdate', end);
  }

  if (params.has('unmute'))
    video.addEventListener('playing', () => {
      video.muted = false;
      log('unmute');
    });
</script>
