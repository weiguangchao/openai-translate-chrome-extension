# Command and args follow .mcp.json (mcpServers.chrome-devtools).
# Codex does not read .mcp.json; trusted projects load this file instead.
[mcp_servers.chrome-devtools]
command = "npx"
args = [
  "-y",
  "chrome-devtools-mcp@latest",
  "--autoConnect",
  "--categoryExtensions",
  "--experimentalIncludeAllPages",
]
startup_timeout_sec = 180
